<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Easybank landing page</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 11px;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>
    <!-- header section-->
    <header>
      <div class="container">
        <div class="flex-container">
          <div class="company-logo">
            <img src="./images/logo.svg" alt="logo image">
          </div>
            <ul>
              <li><a class="bordered" href="#">Home</a></li>
              <li><a class="bordered" href="#">About</a></li>
              <li><a class="bordered" href="#">Contact</a></li>
              <li><a class="bordered" href="#">Blog</a></li>
              <li><a class="bordered" href="#">Careers</a></li>
            </ul>
          </nav>
          <div>
            <button class="desktop-view">Request Invite</button>
            <img src="./images/icon-hamburger.svg" alt="hamburger button">
            </button>  
          </div>
        </div>
      </div>
    </header>
  
  
</body>

</html>
